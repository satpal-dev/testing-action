name: Log Pushes

on:
  push:
    branches:
      - main

jobs:
  log-push:
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Append log
        run: |
          echo "Date: $(date)" >> push-log.txt
          echo "Commit: ${{ github.event.head_commit.message }}" >> push-log.txt
          echo "--------------------------------" >> push-log.txt

      - name: Commit log file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add push-log.txt
          git commit -m "Update push log" || exit 0
          git push
