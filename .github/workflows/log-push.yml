name: Log Pushes

on:
  push:
    branches:
      - main

jobs:
  log-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Add push info to txt file
        run: |
          echo "Date: $(date)" >> push-log.txt
          echo "Commit: ${{ github.event.head_commit.message }}" >> push-log.txt
          echo "" >> push-log.txt

      - name: Commit updated txt file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add push-log.txt
          git commit -m "Update push log" || echo "No changes"

          git push
